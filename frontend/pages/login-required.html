<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Required | NexCart</title>
<link rel="stylesheet" href="../assets/css/navbar.css">

<link rel="stylesheet" href="../assets/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{

    font-family:Poppins,sans-serif;
    background:#f8f8f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

}

.login-required{

    width:450px;
    background:#fff;
    border-radius:18px;
    padding:45px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.login-required i{

    font-size:70px;
    color:#ff7300;
    margin-bottom:20px;

}

.login-required h2{

    font-size:30px;
    margin-bottom:15px;

}

.login-required p{

    color:#666;
    line-height:1.8;
    margin-bottom:30px;

}

.login-btn{

    display:inline-block;
    background:#ff7300;
    color:#fff;
    padding:14px 35px;
    border-radius:30px;
    font-weight:600;
    text-decoration:none;
    transition:.3s;

}

.login-btn:hover{

    background:#e56700;

}

</style>

</head>

<body>


<div class="login-required">

<i class="fa-solid fa-user-lock"></i>

<h2>Login Required</h2>

<p>

Please login to view your Cart and Wishlist.
Login to continue shopping on NexCart.

</p>

<a href="login.html" class="login-btn">
 Login

</a>

</div>
<script src="../assets/js/navbar.js"></script>
</body>

</html>
