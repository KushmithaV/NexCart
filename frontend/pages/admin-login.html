<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login | NexCart</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<link rel="stylesheet" href="../assets/css/navbar.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/responsive.css">

<link rel="stylesheet"
href="../assets/css/admin-login.css">




</head>

<body>

<div class="top-bar">

    <div class="container top-container">

        <div class="top-left">

            🚚 Free Shipping Above ₹999

        </div>

        <div class="top-right">

            <span>📞 +91 98765 43210</span>

            <span>|</span>

            <span>support@nexcart.com</span>

        </div>

    </div>

</div>





<!-- ==========================
            NAVBAR
========================== -->

<nav class="navbar">

    <div class="container nav-container">


        <!-- Logo -->

        <a href="index.html" class="logo">

            <span>Nex</span>Cart

        </a>



        <!-- Home Button (hidden only on homepage) -->

        <a href="index.html" class="home-btn">

            <i class="fa-solid fa-house"></i>

            Home

        </a>



        <!-- Search -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                placeholder="Search Products...">

        </div>




        <!-- Right Side -->

        <div class="nav-right">


            <!-- Wishlist -->

            <a href="#"
            class="nav-icon"
            onclick="openWishlist()">

                <i class="fa-regular fa-heart"></i>

            </a>



            <!-- Cart -->

            <a href="#"
            class="nav-icon"
            onclick="openCart()">

                <i class="fa-solid fa-cart-shopping"></i>

            </a>




            <!-- Login Dropdown -->

            <div class="login-dropdown">


                <button id="loginBtn" class="login-btn" type="button">

                    Login

                    <i class="fa-solid fa-chevron-down"></i>

                </button>



                <div class="dropdown-content">


                    <a href="login.html">

                        <i class="fa-solid fa-user"></i>

                        Customer Login

                    </a>



                    <a href="seller-login.html">

                        <i class="fa-solid fa-store"></i>

                        Seller Login

                    </a>



                    <a href="admin-login.html">

                        <i class="fa-solid fa-user-shield"></i>

                        Admin Login

                    </a>


                </div>


            </div>


        </div>


    </div>

</nav>

<div class="login-container">

<div class="login-card">

<h1>Admin Login</h1>

<form id="adminLoginForm">

<div class="input-group">

<label>Username</label>

<input
type="text"
id="username"
placeholder="Enter Username"
required>

</div>

<div class="input-group">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<i
class="fa-solid fa-eye"
id="toggleAdminPassword">
</i>

</div>

</div>

<button
type="submit"
class="admin-btn">

Login

</button>

</form>

</div>

</div>

<div id="toast" class="toast"></div>

<script src="../assets/js/toast.js"></script>
<script src="../assets/js/navbar.js"></script>

<script src="../assets/js/admin-login.js"></script>

</body>

</html>
