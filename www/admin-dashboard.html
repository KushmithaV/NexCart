<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | NexCart</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/navbar.css">

<link rel="stylesheet"
href="../assets/css/admin-dashboard.css">
<link rel="stylesheet"
href="../assets/css/pendingProducts.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/responsive.css">


</head>

<body>


<!-- ==========================================
                SIDEBAR
========================================== -->

<div class="sidebar" id="sidebar">
    <div class="logo">

        <i class="fa-solid fa-store"></i>

        <h2>NexCart</h2>

    </div>

    <ul>

        <li class="active">

            <a href="#">

                <i class="fa-solid fa-chart-line"></i>

                Dashboard

            </a>

        </li>

        <li>

            <a href="pending-sellers.html">

                <i class="fa-solid fa-user-check"></i>

                Pending Sellers

            </a>

        </li>
        <li>
            <a href="../pages/pendingProducts.html" class="dashboard-card">

<i class="fa-solid fa-box-open"></i>

Pending Products

</a>
        </li>
        


           
 

        <li>

            <a href="admin-orders.html">

                <i class="fa-solid fa-cart-shopping"></i>

                Orders

            </a>

        </li>

        <li>

            <a href="admin-customers.html">

                <i class="fa-solid fa-users"></i>

                Customers

            </a>

        </li>
        <li>

    <a href="admin-notification-history.html">

        <i class="fa-solid fa-bell"></i>

        Notification History

    </a>

</li>

        <li>

            <a href="#"
               id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </li>

    </ul>

</div>

<!-- ==========================================
                MAIN
========================================== -->

<div class="main">

<div class="topbar">

    <button class="menu-toggle" id="menuToggle">
        <i class="fa-solid fa-bars"></i>
    </button>

    <h1>Welcome Admin</h1>

    <div class="notification-container">

        <i class="fa-solid fa-bell" id="notificationBell"></i>

<span id="notificationCount" style="display:none;">0</span>
<div id="notificationDropdown" class="notification-dropdown">

    <div class="notification-header">

        <h4>Notifications</h4>

        <button id="markReadBtn">
            Mark All as Read
        </button>

    </div>

    <div id="notificationList"></div>

</div>

    </div>

</div>

    <!-- Cards -->
<div class="dashboard-grid">

    <div class="card" onclick="location.href='admin-sellers.html'">

        <i class="fa-solid fa-user-check"></i>

        <h2 id="sellerCount">

            0

        </h2>

        <p>

            Sellers

        </p>

    </div>


    <div class="card" onclick="location.href='admin-products.html'">

        <i class="fa-solid fa-box"></i>

        <h2 id="productCount">

            0

        </h2>

        <p>

            Products

        </p>

    </div>


    <div class="card" onclick="location.href='admin-customers.html'">

        <i class="fa-solid fa-users"></i>

        <h2 id="customerCount">

            0

        </h2>

        <p>

            Customers

        </p>

    </div>


    <div class="card" onclick="location.href='admin-orders.html'">

        <i class="fa-solid fa-cart-shopping"></i>

        <h2 id="orderCount">

            0

        </h2>

        <p>

            Orders

        </p>

    </div>


</div>

    <!-- Recent Sellers -->


</div>
<div id="recentActivity"></div>

<script src="../assets/js/admin-dashboard.js"></script>

</body>

</html>
