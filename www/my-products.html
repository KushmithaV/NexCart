<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Products | NexCart</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="../assets/css/my-products.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/responsive.css">


</head>

<body>


<!-- ==========================================
                HEADER
========================================== -->

<header class="page-header">

    <div>

        <h1>My Products</h1>

        <p>Manage all products added by your shop.</p>

    </div>

    <a href="seller-dashboard.html" class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Dashboard

    </a>

</header>

<!-- ==========================================
                PRODUCTS
========================================== -->

<section class="products-section">

    <div id="productGrid" class="product-grid">

        <!-- Products Loaded Here -->

    </div>

</section>

<!-- ==========================================
            EDIT PRODUCT MODAL
========================================== -->

<div id="editModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <h2>Edit Product</h2>

        <form id="editForm">

            <input
            type="hidden"
            id="editProductId">

            <div class="input-group">

                <label>Product Name</label>

                <input
                type="text"
                id="editName"
                required>

            </div>

            <div class="input-group">

                <label>Description</label>

                <textarea
                id="editDescription"
                rows="5"></textarea>

            </div>

            <div class="row">

                <div class="input-group">

                    <label>Price</label>

                    <input
                    type="number"
                    id="editPrice">

                </div>

                <div class="input-group">

                    <label>Discount %</label>

                    <input
                    type="number"
                    id="editDiscount">

                </div>

            </div>

            <div class="input-group">

                <label>Stock</label>

                <input
                type="number"
                id="editStock">

            </div>

            <button
            class="save-btn"
            type="submit">

                Update Product

            </button>

        </form>

    </div>

</div>

<div id="toast" class="toast"></div>

<script src="../assets/js/toast.js"></script>

<script src="../assets/js/my-products.js"></script>

</body>

</html>
