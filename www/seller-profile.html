<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Profile | NexCart</title>


<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
rel="stylesheet">


<link rel="stylesheet"
href="../assets/css/seller-profile.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/responsive.css">



</head>


<body>





<div class="profile-container">


    <div class="profile-header">

        <h1>
            Seller Profile
        </h1>


        <a href="seller-dashboard.html" class="back-btn">

            <i class="ri-arrow-left-line"></i>

            Dashboard

        </a>

    </div>



    <form id="profileForm">


        <div class="row">


            <div class="input-box">

                <label>Full Name</label>

                <input 
                type="text"
                id="full_name"
                readonly>

            </div>



            <div class="input-box">

                <label>Email</label>

                <input
                type="email"
                id="email"
                readonly>

            </div>


        </div>





        <div class="row">


            <div class="input-box">

                <label>Phone</label>

                <input
                type="text"
                id="phone"
                required>

            </div>



            <div class="input-box">

                <label>Shop Name</label>

                <input
                type="text"
                id="shop_name"
                readonly>

            </div>


        </div>





        <div class="input-box">

            <label>GST Number</label>

            <input
            type="text"
            id="gst_number"
            readonly>

        </div>





        <div class="input-box">


            <label>Address</label>


            <textarea
            id="address"
            rows="4"
            required></textarea>


        </div>





        <div class="row">


            <div class="input-box">

                <label>City</label>

                <input
                type="text"
                id="city"
                required>

            </div>



            <div class="input-box">

                <label>State</label>

                <input
                type="text"
                id="state"
                required>

            </div>


        </div>





        <div class="input-box">

            <label>Pincode</label>

            <input
            type="text"
            id="pincode"
            required>

        </div>





        <button 
        type="submit"
        class="save-btn">


            <i class="ri-save-line"></i>

            Update Profile


        </button>




    </form>


</div>



<script src="../assets/js/seller-profile.js"></script>


</body>

</html>
